---
hadoop_version: "3.4.0"
hadoop_home: "/opt/hadoop-{{ hadoop_version }}"
hadoop_conf_dir: "{{ hadoop_home }}/etc/hadoop"
hadoop_java_home: /usr/lib/jvm/java-11-openjdk-amd64
hadoop_daemon_user: hdfs
hadoop_daemon_group: hadoop

yarn_local_dir: /var/lib/hadoop/yarn/local
yarn_log_dir: /var/lib/hadoop/yarn/log

namenode_ip: "{{ hostvars[groups['namenode'][0]].ansible_host }}"
yarn_resourcemanager_web_port: 8088
mapreduce_jobhistory_rpc_port: 10020
mapreduce_jobhistory_web_port: 19888
yarn_nodemanager_web_port: 8042

mapreduce_history_tmp_dir: /mr-history/tmp
mapreduce_history_done_dir: /mr-history/done
mapreduce_classpath: "{{ hadoop_home }}/share/hadoop/mapreduce/*,{{ hadoop_home }}/share/hadoop/mapreduce/lib/*"

hadoop_environment:
  JAVA_HOME: "{{ hadoop_java_home }}"
  HADOOP_HOME: "{{ hadoop_home }}"
  HADOOP_CONF_DIR: "{{ hadoop_conf_dir }}"
  PATH: "{{ hadoop_home }}/bin:{{ hadoop_home }}/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
