---
- name: Подготовка edge для ДЗ2
  hosts: edge
  gather_facts: false
  vars_files:
    - edge/group_vars/all.yml

  tasks:
    - name: Создание директорий проекта
      ansible.builtin.file:
        path: "{{ yarn_edge_project_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - hw1/infra/edge/group_vars
        - hw2/infra/edge

    - name: Копирование плейбуков, inventory и переменных ДЗ1
      ansible.builtin.copy:
        src: ../../hw1/infra/edge/
        dest: "{{ yarn_edge_project_dir }}/hw1/infra/edge/"
        mode: preserve
        directory_mode: "0755"

    - name: Копирование плейбуков ДЗ2
      ansible.builtin.copy:
        src: edge/
        dest: "{{ yarn_edge_project_dir }}/hw2/infra/edge/"
        mode: preserve
        directory_mode: "0755"
